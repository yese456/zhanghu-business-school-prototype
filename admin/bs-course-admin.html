      {id:16, name:"沙发接待话术",       type:"章节课", cat:"销售话术", cols:["沙发"],        lessons:6,  must:true,  learners:158, status:"进行中", scope:"专用", teacher:"林娜", createdAt:"2025-06-27 10:44"},
      {id:17, name:"高端沙发成交话术",   type:"常规课", cat:"销售话术", cols:["沙发"],        lessons:7,  must:false, learners:84,  status:"进行中", scope:"通用", teacher:"周涛", createdAt:"2025-07-01 14:26"},
      {id:18, name:"客户异议处理",       type:"章节课", cat:"销售话术", cols:["综合"],        lessons:9,  must:true,  learners:167, status:"进行中", scope:"专用", teacher:"李伟", createdAt:"2025-07-04 09:50"},
      {id:19, name:"逼单与成交技巧",     type:"常规课", cat:"销售话术", cols:["综合"],        lessons:5,  must:false, learners:103, status:"进行中", scope:"通用", teacher:"张敏", createdAt:"2025-07-08 16:12"},
      {id:20, name:"行业数据分析",       type:"常规课", cat:"数据资料", cols:["综合"],        lessons:6,  must:false, learners:39,  status:"进行中", scope:"专用", teacher:"刘洋", createdAt:"2025-07-12 11:35"},
      {id:21, name:"门店报表解读",       type:"章节课", cat:"数据资料", cols:["综合"],        lessons:7,  must:false, learners:28,  status:"进行中", scope:"专用", teacher:"孙丽", createdAt:"2025-07-16 10:07"},
      {id:22, name:"竞品对比资料包",     type:"常规课", cat:"数据资料", cols:["综合"],        lessons:4,  must:false, learners:66,  status:"进行中", scope:"通用", teacher:"赵磊", createdAt:"2025-07-20 17:03"}
    ]);

    const CATS = cats.map(c => c.name);
    const COLS = ["沙发","床","床垫","柜类","桌椅","综合"];
    const allCats = CATS.concat(COLS);
    const catOptions = [
      {label:"一级分类", options:CATS},
      {label:"二级栏目", options:COLS}
    ];

    const query = reactive({name:"", type:"", col:"", must:""});
    const applied = reactive({name:"", type:"", col:"", must:""});
    const page1 = ref(1), size1 = ref(10);

    const filteredCourses = computed(() => courses.filter(function(c){
      if(applied.name && c.name.indexOf(applied.name) === -1) return false;
      if(applied.type && c.type !== applied.type) return false;
      if(applied.col && c.cat !== applied.col && c.cols.indexOf(applied.col) === -1) return false;
      if(applied.must === "1" && !c.must) return false;
      if(applied.must === "0" && c.must) return false;
      return true;
    }));
    const pagedCourses = computed(() => filteredCourses.value.slice((page1.value - 1) * size1.value, page1.value * size1.value));

    function search(){ Object.assign(applied, query); page1.value = 1; ElMessage.success("已筛选，共 " + filteredCourses.value.length + " 门课程"); }
    function reset(){ Object.keys(query).forEach(k => query[k] = ""); Object.assign(applied, query); page1.value = 1; }

    // ===== 课程表单 =====
    function blankCourse(){ return {id:null, name:"", type:"常规课", cat:"", cols:[], catsValue:[], lessons:1, must:false, learners:0, status:"进行中", scope:"专用", teacher:"", createdAt:"", desc:""}; }
    const form = reactive(blankCourse());
    const rules = {
      name:[{required:true, message:"请输入课程名称", trigger:"blur"}],
      catsValue:[{required:true, message:"请至少选择一个课程分类", trigger:"change"}]
    };
    // 表格里展示的课程分类标签 = 一级分类 + 多个二级栏目
    function catTags(row){
      return row.cat ? [row.cat].concat(row.cols.filter(c => c !== row.cat)) : row.cols.slice();
    }
    function openCourse(row, type){
      Object.assign(form, row ? JSON.parse(JSON.stringify(row)) : blankCourse());
      if(!row && type) form.type = type;
      form.catsValue = catTags(form);
      drawer.value = true;
    }
    function submit(){
      formRef.value.validate(ok => {
        if(!ok) return;
        if(form.id){
          const i = courses.findIndex(c => c.id === form.id);
          courses.splice(i, 1, Object.assign({}, form));
          ElMessage.success("课程「" + form.name + "」已保存");
        }else{
          const now = new Date(), pad = n => String(n).padStart(2, "0");
          form.id = courses.length ? Math.max.apply(null, courses.map(c => c.id)) + 1 : 1;
          form.createdAt = now.getFullYear() + "-" + pad(now.getMonth() + 1) + "-" + pad(now.getDate()) + " " + pad(now.getHours()) + ":" + pad(now.getMinutes());
          // 多选值回写：第一个一级分类作为主分类，其余归为二级栏目
          form.cat = (form.catsValue.filter(x => CATS.indexOf(x) > -1)[0]) || "";
          form.cols = form.catsValue.filter(x => COLS.indexOf(x) > -1);
          courses.unshift(Object.assign({}, form));
          ElMessage.success("课程「" + form.name + "」已创建，已同步至小程序");
        }
        drawer.value = false;
      });
    }
    function notify(row){ ElMessage.success("已向学习「" + row.name + "」的学员推送通知"); }
    function toggleCoursePin(row){
      row.pinned = !row.pinned;
      const i = courses.findIndex(c => c.id === row.id);
      courses.unshift(courses.splice(i, 1)[0]);
      ElMessage.success(row.pinned ? "已置顶「" + row.name + "」" : "已取消置顶「" + row.name + "」");
    }
    function offline(row){
      row.status = row.status === "进行中" ? "已下架" : "进行中";
      ElMessage.success("「" + row.name + "」已" + (row.status === "已下架" ? "下架" : "上架"));
    }
    function batch(){
      selected.value.forEach(r => { r.status = "已下架"; });
      ElMessage.success("已批量下架 " + selected.value.length + " 门课程");
      selected.value = [];
    }

    // ===== 分类 =====
    const sortedCats = computed(() => cats.slice().sort(function(a,b){
      if(a.pinned !== b.pinned) return a.pinned ? -1 : 1;
      if(a.pinned && b.pinned) return (a.pinOrder||0) - (b.pinOrder||0);
      return a.sort - b.sort;
    }));
    const totalSubs = computed(() => cats.reduce((a,c) => a + c.subs.length, 0));
    const crossCount = computed(() => courses.reduce((a,c) => a + catTags(c).length, 0));
    function catCourseCount(row){ return courses.filter(c => c.cat === row.name).length; }
    function subCourseCount(row, sub){ return courses.filter(c => c.cat === row.name && c.cols.indexOf(sub.name) > -1).length; }
    function isCross(row, sub){ return courses.some(c => c.cat === row.name && c.cols.indexOf(sub.name) > -1 && c.cols.length > 1); }

    let pinSeq = 0;
    function togglePin(row){
      row.pinned = !row.pinned;
      if(row.pinned) row.pinOrder = ++pinSeq;
      ElMessage.success(row.pinned ? "已置顶「" + row.name + "」" : "已取消置顶「" + row.name + "」");
      if(row.pinned){
        cats.sort(function(a,b){
          if(a.pinned !== b.pinned) return a.pinned ? -1 : 1;
          if(a.pinned && b.pinned) return (a.pinOrder||0) - (b.pinOrder||0);
          return a.sort - b.sort;
        });
      }
    }

    // 新建 / 编辑分类弹窗
    const catForm = reactive({id:null, name:"", parent:"", sort:0, pinned:false, note:""});
    const catRules = {
      name:[{required:true, message:"请输入分类名称", trigger:"blur"}]
    };
    function openCat(row){
      catForm.id = row ? row.id : null;
      catForm.name = row ? row.name : "";
      catForm.parent = "";
      catForm.sort = row ? row.sort : cats.length + 1;
      catForm.pinned = row ? !!row.pinned : false;
      catForm.note = "";
      catDialog.value = true;
    }
    function openSub(parent, sub){
      catForm.id = null;
      catForm.name = sub ? sub.name : "";
      catForm.parent = parent.name;
      catForm.sort = sub ? sub.sort : parent.subs.length;
      catForm.pinned = false;
      catForm.note = "";
      catDialog.value = true;
    }
    function submitCat(){
      catFormRef.value.validate(function(ok){
        if(!ok) return;
        if(catForm.parent){
          const p = cats.find(c => c.name === catForm.parent);
          const exist = p.subs.find(s => s.name === catForm.name);
          if(exist) exist.sort = catForm.sort;
          else p.subs.push({name:catForm.name, sort:catForm.sort});
          ElMessage.success("二级栏目「" + catForm.name + "」已保存");
        }else if(catForm.id){
          const row = cats.find(c => c.id === catForm.id);
          row.name = catForm.name; row.sort = catForm.sort; row.pinned = catForm.pinned;
          if(row.pinned && !row.pinOrder) row.pinOrder = ++pinSeq;
          ElMessage.success("一级分类「" + catForm.name + "」已保存");
        }else{
          cats.push({id: Date.now(), name:catForm.name, sort:catForm.sort, pinned:catForm.pinned, subs:[]});
          ElMessage.success("一级分类「" + catForm.name + "」已创建");
        }
        catDialog.value = false;
      });
    }
    function delCat(row){
      ElMessageBox.confirm("删除一级分类「" + row.name + "」后其下二级栏目一并删除，已挂载课程不受影响。确认删除？", "删除确认", {type:"warning"})
        .then(function(){
          const i = cats.findIndex(c => c.name === row.name);
          cats.splice(i, 1);
          ElMessage.success("已删除「" + row.name + "」");
        }).catch(function(){});
    }
    function delSub(parent, sub){
      ElMessageBox.confirm("确定删除二级栏目「" + sub.name + "」？", "删除确认", {type:"warning"})
        .then(function(){
          const p = cats.find(c => c.name === parent.name);
          p.subs = p.subs.filter(x => x.name !== sub.name);
          ElMessage.success("已删除「" + sub.name + "」");
        }).catch(function(){});
    }

    return {
      page, drawer, catDialog, selected, formRef, catFormRef,
      cats, courses, allCats, catOptions,
      query, page1, size1, filteredCourses, pagedCourses, search, reset,
      form, rules, catTags, openCourse, submit, notify, toggleCoursePin, offline, batch,
      sortedCats, totalSubs, crossCount, catCourseCount, subCourseCount, isCross,
      togglePin, delCat, catForm, catRules, openCat, openSub, submitCat, delSub
    };
  }
}).use(ElementPlus, { locale: ElementPlusLocaleZhCn }).mount('#app');
</script>
</body>
</html>
