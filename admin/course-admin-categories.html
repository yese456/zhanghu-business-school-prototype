<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>掌狐后台 · 课程分类</title>
<style>
:root{
  --blue:#1e80ff;
  --blue-dark:#1668d9;
  --text:#333;
  --text2:#666;
  --text3:#999;
  --line:#e8e8e8;
  --th-bg:#fafafa;
  --bg:#f5f6f8;
  --warn:#f57c00;
  --warn-bg:#fff3e0;
  --danger:#e5484d;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;background:var(--bg);color:var(--text)}
/* 顶栏 */
.topbar{height:54px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.brand{font-size:16px;font-weight:600}
.brand small{color:var(--text3);font-weight:400;margin-left:8px;font-size:13px}
.topbar .who{color:var(--text2);font-size:13px}
/* 二级导航（商学院模块） */
.subnav{background:#fff;border-bottom:1px solid var(--line);display:flex;gap:4px;padding:0 24px}
.subnav a{padding:12px 14px;font-size:14px;color:var(--text2);text-decoration:none;border-bottom:2px solid transparent;cursor:pointer}
.subnav a:hover{color:var(--blue)}
.subnav a.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:500}
/* 内容 */
.main{padding:20px 24px;max-width:1100px}
.breadcrumb{color:var(--text3);font-size:13px;margin-bottom:12px}
.breadcrumb b{color:var(--text2)}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px}
.page-head h2{font-size:18px;font-weight:600}
.page-head .sub{color:var(--text3);font-size:13px;margin-top:4px;max-width:560px}
/* 按钮 */
.btn-primary{background:var(--blue);color:#fff;border:none;border-radius:4px;height:32px;padding:0 14px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.btn-primary:hover{background:var(--blue-dark)}
.btn-ghost{background:#fff;border:1px solid var(--line);border-radius:4px;height:32px;padding:0 14px;font-size:13px;color:var(--text2);cursor:pointer}
.btn-ghost:hover{border-color:var(--blue);color:var(--blue)}
/* 表格 */
.panel{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:11px 16px;text-align:left}
th{background:var(--th-bg);color:var(--text2);font-weight:500;white-space:nowrap}
tr.lvl1{cursor:pointer}
tr.lvl1:hover td{background:#fafcff}
tr.lvl2 td{color:var(--text2);background:#fcfcfd}
tr.lvl2:hover td{background:#f7f8fa}
.col-name{width:42%}
.tri{display:inline-block;width:0;height:0;margin-right:8px;vertical-align:middle;border-left:5px solid #999;border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .15s}
.tri.open{transform:rotate(90deg)}
.tri.leaf{visibility:hidden}
.pad2{padding-left:62px}
.pin-badge{display:inline-block;background:var(--warn-bg);color:var(--warn);font-size:11px;border:1px solid #ffd699;border-radius:3px;padding:1px 6px;margin-right:6px}
.ops a{color:var(--blue);text-decoration:none;margin-right:14px;cursor:pointer;white-space:nowrap}
.ops a:hover{text-decoration:underline}
.ops a.danger{color:var(--danger)}
.ops a.pin{color:var(--warn)}
.ops a.unpin{color:var(--text3)}
.sort-num{color:var(--text2)}
.empty-tip{color:#bbb;padding:14px;text-align:center;font-size:13px}
/* 弹窗 */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:10}
.mask.show{display:flex}
.modal{background:#fff;border-radius:6px;width:420px;max-width:92vw;box-shadow:0 8px 30px rgba(0,0,0,.18)}
.modal-title{padding:16px 20px;font-size:16px;font-weight:600;border-bottom:1px solid var(--line)}
.modal-body{padding:18px 20px}
.modal-body label{display:block;font-size:13px;color:var(--text2);margin:12px 0 6px}
.modal-body label:first-child{margin-top:0}
.modal-body input{width:100%;height:34px;border:1px solid var(--line);border-radius:4px;padding:0 10px;font-size:13px;outline:none}
.modal-body input:focus{border-color:var(--blue)}
.modal-body input:disabled{background:#f5f5f5;color:var(--text3)}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
/* toast */
#toast{position:fixed;left:50%;top:24px;transform:translateX(-50%);background:rgba(0,0,0,.78);color:#fff;font-size:13px;border-radius:4px;padding:8px 16px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.show{opacity:1}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">掌狐后台 <small>商学院</small></div>
  <div class="who">管理员 · Eric</div>
</div>
<div class="subnav">
  <a>课程管理</a>
  <a>学习记录</a>
  <a class="active">课程分类</a>
  <a>学习园地</a>
  <a>学院设置</a>
</div>
<div class="main">
  <div class="breadcrumb">商学院 / <b>课程分类</b></div>
  <div class="page-head">
    <div>
      <h2>课程分类管理</h2>
      <div class="sub">一级分类对应小程序课程页左侧菜单，二级栏目对应小程序顶部筛选。结构按线上掌狐后台 #bsSort 复刻，分类数据取自线上，子分类与课程数为演示用 mock。</div>
    </div>
    <button class="btn-primary" onclick="openModal('addCat')"><span style="font-size:15px;line-height:1">＋</span>新增课程分类</button>
  </div>
  <div class="panel">
    <table>
      <thead>
        <tr><th class="col-name">课程分类</th><th>课程数量</th><th>排序</th><th>操作</th></tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<div class="mask" id="mask" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-title" id="modalTitle">新增课程分类</div>
    <div class="modal-body">
      <label>分类名称</label>
      <input id="fName" placeholder="如：新人培训、产品学习">
      <label>上级分类</label>
      <input id="fParent" disabled placeholder="一级分类无需填写">
      <label>排序</label>
      <input id="fSort" type="number" value="0">
      <label>备注</label>
      <input id="fNote" placeholder="选填，说明该分类用途">
    </div>
    <div class="modal-foot">
      <button class="btn-ghost" onclick="closeModal()">取消</button>
      <button class="btn-primary" onclick="saveModal()">保存</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
// 一级分类 = 小程序课程页左侧菜单；二级栏目 = 小程序顶部筛选（沙发/床/床垫/柜类/桌椅/综合 等）
// 一级分类名称取自线上掌狐后台 #bsSort（2026-10-21 抓取），顺序与线上一致
// 子分类名称、课程数量为演示 mock 数据
var DATA = [
  {name:"本月推荐",     sort:1, pinned:false, children:[{name:"爆款案例",count:6,sort:1},{name:"新人必看",count:3,sort:2}]},
  {name:"新人培训",     sort:2, pinned:false, children:[{name:"入职引导",count:3,sort:1}]},
  {name:"产品学习",     sort:3, pinned:false, children:[{name:"沙发系列",count:4,sort:1},{name:"床垫系列",count:1,sort:2}]},
  {name:"技能提升",     sort:4, pinned:false, children:[{name:"沟通技巧",count:3,sort:1}]},
  {name:"门店管理培训", sort:5, pinned:false, children:[]},
  {name:"销售技能培训", sort:6, pinned:false, children:[]},
  {name:"企业文化",     sort:7, pinned:false, children:[]},
  {name:"产品讲解",     sort:8, pinned:false, children:[]}
];
var expanded = {};
var pinSeq = 0;
var editing = null;

// 默认全部展开，与线上一致
DATA.forEach(function(c){ expanded[c.name] = true; });

function findCat(name){ return DATA.find(function(x){ return x.name === name; }); }
function total(c){ return c.children.reduce(function(a,b){ return a + (b.count || 0); }, 0); }
function sortList(){
  DATA.sort(function(a,b){
    if(a.pinned !== b.pinned) return a.pinned ? -1 : 1;
    if(a.pinned && b.pinned) return (a.pinOrder || 0) - (b.pinOrder || 0);
    return a.sort - b.sort;
  });
}
function render(){
  sortList();
  var html = "";
  DATA.forEach(function(c){
    var open = !!expanded[c.name];
    html += '<tr class="lvl1" onclick="toggle(\'' + c.name + '\')">'
      + '<td><span class="tri ' + (open ? 'open' : '') + '"></span>'
      + (c.pinned ? '<span class="pin-badge">置顶</span>' : '') + c.name + '</td>'
      + '<td>' + total(c) + '</td>'
      + '<td class="sort-num">' + (c.pinned ? '置顶优先' : c.sort) + '</td>'
      + '<td class="ops" onclick="event.stopPropagation()">'
      + '<a onclick="openModal(\'addSub\',\'' + c.name + '\')">新增子分类</a>'
      + '<a onclick="openModal(\'editCat\',\'' + c.name + '\')">编辑</a>'
      + '<a class="danger" onclick="delCat(\'' + c.name + '\')">删除</a>'
      + (c.pinned
          ? '<a class="unpin" onclick="togglePin(\'' + c.name + '\')">取消置顶</a>'
          : '<a class="pin" onclick="togglePin(\'' + c.name + '\')">置顶</a>')
      + '</td></tr>';
    if(open){
      if(c.children.length){
        c.children.forEach(function(sub){
          html += '<tr class="lvl2"><td class="pad2"><span class="tri leaf"></span>' + sub.name + '</td>'
            + '<td>' + (sub.count || 0) + '</td>'
            + '<td class="sort-num">' + sub.sort + '</td>'
            + '<td class="ops"><a onclick="openModal(\'editSub\',\'' + c.name + '\',\'' + sub.name + '\')">编辑</a>'
            + '<a class="danger" onclick="delSub(\'' + c.name + '\',\'' + sub.name + '\')">删除</a></td></tr>';
        });
      }else{
        html += '<tr class="lvl2"><td colspan="4"><div class="empty-tip">暂无子分类，点击「新增子分类」创建</div></td></tr>';
      }
    }
  });
  document.getElementById('tbody').innerHTML = html;
}
function toggle(name){ expanded[name] = !expanded[name]; render(); }

/* ===== 弹窗：新增 / 编辑 分类 ===== */
function openModal(mode, cat, sub){
  editing = {mode:mode, cat:cat, sub:sub};
  var title = '', name = '', parent = '', sort = '', note = '';
  if(mode === 'addCat'){
    title = '新增课程分类'; name = ''; parent = ''; sort = DATA.length + 1; note = '';
  }else if(mode === 'addSub'){
    var c = findCat(cat); title = '新增子分类'; name = ''; parent = c.name; sort = c.children.length + 1; note = '';
  }else if(mode === 'editCat'){
    var c2 = findCat(cat); title = '编辑一级分类'; name = c2.name; parent = ''; sort = c2.sort; note = c2.note || '';
  }else if(mode === 'editSub'){
    var c3 = findCat(cat); var s = c3.children.find(function(x){ return x.name === sub; });
    title = '编辑子分类'; name = s.name; parent = c3.name; sort = s.sort; note = '';
  }
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('fName').value = name;
  var fp = document.getElementById('fParent');
  fp.value = parent; fp.disabled = !!parent;
  document.getElementById('fSort').value = sort;
  document.getElementById('fNote').value = note;
  document.getElementById('mask').classList.add('show');
  setTimeout(function(){ document.getElementById('fName').focus(); }, 50);
}
function closeModal(){ document.getElementById('mask').classList.remove('show'); editing = null; }
function saveModal(){
  if(!editing) return;
  var name = document.getElementById('fName').value.trim();
  var sort = parseInt(document.getElementById('fSort').value, 10) || 0;
  var note = document.getElementById('fNote').value.trim();
  if(!name){ toast('请输入分类名称'); return; }
  var m = editing.mode;
  if(m === 'addCat'){
    if(DATA.some(function(c){ return c.name === name; })){ toast('分类已存在'); return; }
    DATA.push({name:name, sort:sort, pinned:false, note:note, children:[]});
    expanded[name] = true;
    toast('已新增一级分类「' + name + '」');
  }else if(m === 'addSub'){
    var c = findCat(editing.cat);
    if(c.children.some(function(x){ return x.name === name; })){ toast('子分类已存在'); return; }
    c.children.push({name:name, sort:sort, count:0});
    toast('已新增子分类「' + name + '」');
  }else if(m === 'editCat'){
    var c2 = findCat(editing.cat);
    if(name !== c2.name && DATA.some(function(x){ return x.name === name; })){ toast('分类名称已存在'); return; }
    expanded[name] = expanded[c2.name]; delete expanded[c2.name];
    c2.name = name; c2.sort = sort; c2.note = note;
    toast('已保存');
  }else if(m === 'editSub'){
    var c3 = findCat(editing.cat);
    var s = c3.children.find(function(x){ return x.name === editing.sub; });
    if(name !== s.name && c3.children.some(function(x){ return x.name === name; })){ toast('子分类已存在'); return; }
    s.name = name; s.sort = sort;
    toast('已保存');
  }
  closeModal(); render();
}

/* ===== 置顶 ===== */
function togglePin(name){
  var c = findCat(name); c.pinned = !c.pinned;
  if(c.pinned){ c.pinOrder = ++pinSeq; toast('已将「' + name + '」置顶'); }
  else{ toast('已取消「' + name + '」置顶'); }
  render();
}

/* ===== 删除 ===== */
function delCat(name){
  if(!confirm('确定删除一级分类「' + name + '」？其下子分类将一并删除。')) return;
  DATA = DATA.filter(function(c){ return c.name !== name; });
  delete expanded[name]; toast('已删除「' + name + '」'); render();
}
function delSub(cat, sub){
  if(!confirm('确定删除子分类「' + sub + '」？')) return;
  var c = findCat(cat); c.children = c.children.filter(function(x){ return x.name !== sub; });
  toast('已删除「' + sub + '」'); render();
}

/* ===== toast ===== */
var toastTimer;
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 1800);
}

render();
</script>
</body>
</html>
