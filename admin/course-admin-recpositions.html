<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>掌狐后台 · 推荐位管理</title>
<style>
:root{
  --blue:#1e80ff;
  --blue-dark:#1668d9;
  --text:#333;
  --text2:#666;
  --text3:#999;
  --line:#e8e8e8;
  --th-bg:#fafafa;
  --bg:#f5f6f8;
  --danger:#e5484d;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;background:var(--bg);color:var(--text)}
/* 顶栏 */
.topbar{height:54px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.brand{font-size:16px;font-weight:600}
.brand small{color:var(--text3);font-weight:400;margin-left:8px;font-size:13px}
.topbar .who{color:var(--text2);font-size:13px}
/* 二级导航（商学院模块） */
.subnav{background:#fff;border-bottom:1px solid var(--line);display:flex;gap:4px;padding:0 24px}
.subnav a{padding:12px 14px;font-size:14px;color:var(--text2);text-decoration:none;border-bottom:2px solid transparent;cursor:pointer}
.subnav a:hover{color:var(--blue)}
.subnav a.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:500}
/* 内容 */
.main{padding:20px 24px;max-width:1100px}
.breadcrumb{color:var(--text3);font-size:13px;margin-bottom:12px}
.breadcrumb b{color:var(--text2)}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px}
.page-head h2{font-size:18px;font-weight:600}
.page-head .sub{color:var(--text3);font-size:13px;margin-top:4px;max-width:600px;line-height:20px}
/* 按钮 */
.btn-primary{background:var(--blue);color:#fff;border:none;border-radius:4px;height:32px;padding:0 14px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.btn-primary:hover{background:var(--blue-dark)}
.btn-ghost{background:#fff;border:1px solid var(--line);border-radius:4px;height:32px;padding:0 14px;font-size:13px;color:var(--text2);cursor:pointer}
.btn-ghost:hover{border-color:var(--blue);color:var(--blue)}
/* 表格 */
.panel{background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:11px 16px;text-align:left}
th{background:var(--th-bg);color:var(--text2);font-weight:500;white-space:nowrap}
tr.lvl1{cursor:pointer}
tr.lvl1:hover td{background:#fafcff}
tr.lvl2 td{color:var(--text2);background:#fcfcfd}
tr.lvl2:hover td{background:#f7f8fa}
.col-name{width:42%}
.col-cnt{width:120px}
.tri{display:inline-block;width:0;height:0;margin-right:8px;vertical-align:middle;border-left:5px solid #999;border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .15s}
.tri.open{transform:rotate(90deg)}
.tri.leaf{visibility:hidden}
.pad2{padding-left:62px}
.ops a{color:var(--blue);text-decoration:none;margin-right:14px;cursor:pointer;white-space:nowrap}
.ops a:hover{text-decoration:underline}
.ops a.danger{color:var(--danger)}
.ops a.order{color:var(--text2)}
.ops a.order.disabled{color:var(--text3);cursor:not-allowed;text-decoration:none}
.sort-num{color:var(--text2)}
.empty-tip{color:#bbb;padding:14px;text-align:center;font-size:13px}
.cnt-badge{display:inline-block;min-width:28px;text-align:center;background:#f0f5ff;color:var(--blue);border:1px solid #d6e4ff;border-radius:10px;padding:1px 8px;font-size:12px}
/* 弹窗 */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:10}
.mask.show{display:flex}
.modal{background:#fff;border-radius:6px;width:420px;max-width:92vw;box-shadow:0 8px 30px rgba(0,0,0,.18)}
.modal-title{padding:16px 20px;font-size:16px;font-weight:600;border-bottom:1px solid var(--line)}
.modal-body{padding:18px 20px}
.modal-body label{display:block;font-size:13px;color:var(--text2);margin:12px 0 6px}
.modal-body label:first-child{margin-top:0}
.modal-body input{width:100%;height:34px;border:1px solid var(--line);border-radius:4px;padding:0 10px;font-size:13px;outline:none}
.modal-body input:focus{border-color:var(--blue)}
.modal-body input:disabled{background:#f5f5f5;color:var(--text3)}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
/* toast */
#toast{position:fixed;left:50%;top:24px;transform:translateX(-50%);background:rgba(0,0,0,.78);color:#fff;font-size:13px;border-radius:4px;padding:8px 16px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.show{opacity:1}
</style>
</head>
<body>
<div class="topbar">
  <a class="brand" href="../mp/course-admin-home.html" style="text-decoration:none;color:inherit">掌狐后台 <small>商学院</small></a>
  <div class="who">管理员 · Eric</div>
</div>
<div class="subnav">
  <a>课程管理</a>
  <a>学习记录</a>
  <a href="course-admin-categories.html">课程分类</a>
  <a class="active">推荐位管理</a>
  <a>学习园地</a>
  <a>学院设置</a>
</div>
<div class="main">
  <div class="breadcrumb">商学院 / <b>推荐位管理</b></div>
  <div class="page-head">
    <div>
      <h2>推荐位管理</h2>
      <div class="sub">一级推荐位为课程在小程序各入口的展示位（如首页轮播、课程列表置顶）；二级推荐位用于进一步细分。支持新增子推荐位、编辑名称、上移/下移调整顺序、删除。推荐课程数量为演示用 mock 数据。</div>
    </div>
    <button class="btn-primary" onclick="openModal('addRec')"><span style="font-size:15px;line-height:1">＋</span>新增推荐位</button>
    <button class="btn-ghost" onclick="location.href='course-page-leftmenu.html'">查看小程序课程 ›</button>
  </div>
  <div class="panel">
    <table>
      <thead>
        <tr><th class="col-name">推荐位</th><th class="col-cnt">推荐课程数量</th><th>排序</th><th>操作</th></tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<div class="mask" id="mask" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-title" id="modalTitle">新增推荐位</div>
    <div class="modal-body">
      <label>推荐位名称</label>
      <input id="fName" placeholder="如：首页轮播、课程列表置顶">
      <label>上级推荐位</label>
      <input id="fParent" disabled placeholder="一级推荐位无需填写">
      <label>备注</label>
      <input id="fNote" placeholder="选填，说明该推荐位用途">
    </div>
    <div class="modal-foot">
      <button class="btn-ghost" onclick="closeModal()">取消</button>
      <button class="btn-primary" onclick="saveModal()">保存</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
// 推荐位层级：一级推荐位 + 二级推荐位（细分入口）
// 推荐课程数量为演示 mock 数据
var DATA = [
  {name:"首页轮播",     note:"小程序首页顶部轮播位", children:[
    {name:"爆款案例",count:6},{name:"新人必看",count:3}]},
  {name:"课程列表置顶", note:"课程列表固定置顶位",   children:[]},
  {name:"学习专区",     note:"学习中心专区入口",     children:[
    {name:"沙发专区",count:4},{name:"床垫专区",count:2}]},
  {name:"限时活动",     note:"限时优惠/活动位",      children:[]},
  {name:"行业资讯",     note:"行业资讯展示位",       children:[]}
];
var expanded = {};
var editing = null;

// 默认全部展开
DATA.forEach(function(c){ expanded[c.name] = true; });

function findRec(name){ return DATA.find(function(x){ return x.name === name; }); }
// 跳转小程序端课程列表（章节课 / 课程详情）
function goCourses(){ location.href = 'course-chapter.html'; }
// 一级推荐课程数量：有子位则取子位合计，否则取自身数量
function lvlCount(c){ return c.children.length ? c.children.reduce(function(a,b){ return a + (b.count||0); },0) : (c.count||0); }

function render(){
  var html = "";
  DATA.forEach(function(c, i){
    var open = !!expanded[c.name];
    var canUp = i > 0, canDown = i < DATA.length - 1;
    html += '<tr class="lvl1" onclick="toggle(\'' + c.name + '\')">'
      + '<td><span class="tri ' + (open ? 'open' : '') + '"></span>' + c.name + '</td>'
      + '<td><span class="cnt-badge">' + lvlCount(c) + '</span></td>'
      + '<td class="sort-num">' + (i + 1) + '</td>'
      + '<td class="ops" onclick="event.stopPropagation()">'
      + '<a onclick="goCourses()">查看课程</a>'
      + '<a onclick="openModal(\'addSub\',\'' + c.name + '\')">新增子推荐位</a>'
      + '<a onclick="openModal(\'editRec\',\'' + c.name + '\')">编辑</a>'
      + '<a class="order ' + (canUp ? '' : 'disabled') + '" ' + (canUp ? 'onclick="moveUp(\'' + c.name + '\')"' : '') + '>上移</a>'
      + '<a class="order ' + (canDown ? '' : 'disabled') + '" ' + (canDown ? 'onclick="moveDown(\'' + c.name + '\')"' : '') + '>下移</a>'
      + '<a class="danger" onclick="delRec(\'' + c.name + '\')">删除</a>'
      + '</td></tr>';
    if(open){
      if(c.children.length){
        c.children.forEach(function(sub, j){
          var sUp = j > 0, sDown = j < c.children.length - 1;
          html += '<tr class="lvl2"><td class="pad2"><span class="tri leaf"></span>' + sub.name + '</td>'
            + '<td><span class="cnt-badge">' + (sub.count||0) + '</span></td>'
            + '<td class="sort-num">' + (j + 1) + '</td>'
            + '<td class="ops">'
            + '<a onclick="openModal(\'editSub\',\'' + c.name + '\',\'' + sub.name + '\')">编辑</a>'
            + '<a class="order ' + (sUp ? '' : 'disabled') + '" ' + (sUp ? 'onclick="moveUpSub(\'' + c.name + '\',' + j + ')"' : '') + '>上移</a>'
            + '<a class="order ' + (sDown ? '' : 'disabled') + '" ' + (sDown ? 'onclick="moveDownSub(\'' + c.name + '\',' + j + ')"' : '') + '>下移</a>'
            + '<a class="danger" onclick="delSub(\'' + c.name + '\',\'' + sub.name + '\')">删除</a>'
            + '</td></tr>';
        });
      }else{
        html += '<tr class="lvl2"><td colspan="4"><div class="empty-tip">暂无子推荐位，点击「新增子推荐位」创建</div></td></tr>';
      }
    }
  });
  document.getElementById('tbody').innerHTML = html;
}
function toggle(name){ expanded[name] = !expanded[name]; render(); }

/* ===== 调整顺序：上移/下移（一级） ===== */
function moveUp(name){
  var i = DATA.findIndex(function(x){ return x.name === name; });
  if(i > 0){ var t = DATA[i-1]; DATA[i-1] = DATA[i]; DATA[i] = t; toast('已上移「' + name + '」'); render(); }
}
function moveDown(name){
  var i = DATA.findIndex(function(x){ return x.name === name; });
  if(i < DATA.length - 1){ var t = DATA[i+1]; DATA[i+1] = DATA[i]; DATA[i] = t; toast('已下移「' + name + '」'); render(); }
}
/* ===== 调整顺序：上移/下移（二级） ===== */
function moveUpSub(cat, j){
  var c = findRec(cat);
  if(j > 0){ var t = c.children[j-1]; c.children[j-1] = c.children[j]; c.children[j] = t; render(); }
}
function moveDownSub(cat, j){
  var c = findRec(cat);
  if(j < c.children.length - 1){ var t = c.children[j+1]; c.children[j+1] = c.children[j]; c.children[j] = t; render(); }
}

/* ===== 弹窗：新增 / 编辑 推荐位 ===== */
function openModal(mode, cat, sub){
  editing = {mode:mode, cat:cat, sub:sub};
  var title = '', name = '', parent = '', note = '';
  if(mode === 'addRec'){
    title = '新增一级推荐位'; name = ''; parent = ''; note = '';
  }else if(mode === 'addSub'){
    var c = findRec(cat); title = '新增子推荐位'; name = ''; parent = c.name; note = '';
  }else if(mode === 'editRec'){
    var c2 = findRec(cat); title = '编辑一级推荐位'; name = c2.name; parent = ''; note = c2.note || '';
  }else if(mode === 'editSub'){
    var c3 = findRec(cat); var s = c3.children.find(function(x){ return x.name === sub; });
    title = '编辑子推荐位'; name = s.name; parent = c3.name; note = '';
  }
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('fName').value = name;
  var fp = document.getElementById('fParent');
  fp.value = parent; fp.disabled = !!parent;
  document.getElementById('fNote').value = note;
  document.getElementById('mask').classList.add('show');
  setTimeout(function(){ document.getElementById('fName').focus(); }, 50);
}
function closeModal(){ document.getElementById('mask').classList.remove('show'); editing = null; }
function saveModal(){
  if(!editing) return;
  var name = document.getElementById('fName').value.trim();
  var note = document.getElementById('fNote').value.trim();
  if(!name){ toast('请输入推荐位名称'); return; }
  var m = editing.mode;
  if(m === 'addRec'){
    if(DATA.some(function(c){ return c.name === name; })){ toast('推荐位已存在'); return; }
    DATA.push({name:name, note:note, children:[]});
    expanded[name] = true;
    toast('已新增一级推荐位「' + name + '」');
  }else if(m === 'addSub'){
    var c = findRec(editing.cat);
    if(c.children.some(function(x){ return x.name === name; })){ toast('子推荐位已存在'); return; }
    c.children.push({name:name, count:0});
    toast('已新增子推荐位「' + name + '」');
  }else if(m === 'editRec'){
    var c2 = findRec(editing.cat);
    if(name !== c2.name && DATA.some(function(x){ return x.name === name; })){ toast('推荐位名称已存在'); return; }
    expanded[name] = expanded[c2.name]; delete expanded[c2.name];
    c2.name = name; c2.note = note;
    toast('已保存');
  }else if(m === 'editSub'){
    var c3 = findRec(editing.cat);
    var s = c3.children.find(function(x){ return x.name === editing.sub; });
    if(name !== s.name && c3.children.some(function(x){ return x.name === name; })){ toast('子推荐位已存在'); return; }
    s.name = name;
    toast('已保存');
  }
  closeModal(); render();
}

/* ===== 删除 ===== */
function delRec(name){
  if(!confirm('确定删除一级推荐位「' + name + '」？其下子推荐位将一并删除。')) return;
  DATA = DATA.filter(function(c){ return c.name !== name; });
  delete expanded[name]; toast('已删除「' + name + '」'); render();
}
function delSub(cat, sub){
  if(!confirm('确定删除子推荐位「' + sub + '」？')) return;
  var c = findRec(cat); c.children = c.children.filter(function(x){ return x.name !== sub; });
  toast('已删除「' + sub + '」'); render();
}

/* ===== toast ===== */
var toastTimer;
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 1800);
}

render();
</script>
</body>
</html>
