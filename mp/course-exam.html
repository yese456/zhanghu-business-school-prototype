<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>掌狐小程序 · 我的考试</title>
<style>
  :root{
    --ink:#1f2329; --sub:#8a909c; --bg:#dfe3ea; --line:#eceff4;
    --blue:#3c7cfc; --blue-bg:#eef3ff; --orange:#ff7a3c; --gray:#b6bcc7;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;background:var(--bg);display:flex;justify-content:center;padding:24px 12px;-webkit-font-smoothing:antialiased}
  .phone{width:390px;max-width:100%;background:#fff;min-height:780px;border-radius:30px;overflow:hidden;box-shadow:0 24px 60px rgba(20,30,60,.18);display:flex;flex-direction:column;position:relative}
  /* 状态栏 */
  .statusbar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:13px;font-weight:600;color:var(--ink)}
  .statusbar .right{display:flex;align-items:center;gap:6px}
  .signal{display:flex;gap:2px;align-items:flex-end;height:11px}
  .signal i{width:3px;background:var(--ink);border-radius:1px}
  .signal i:nth-child(1){height:4px}.signal i:nth-child(2){height:6px}.signal i:nth-child(3){height:8px}.signal i:nth-child(4){height:11px}
  .battery{width:22px;height:11px;border:1.5px solid var(--ink);border-radius:3px;position:relative}
  .battery:after{content:"";position:absolute;right:-3px;top:3px;width:2px;height:5px;background:var(--ink);border-radius:0 1px 1px 0}
  .battery i{position:absolute;left:1.5px;top:1.5px;bottom:1.5px;width:62%;background:var(--ink);border-radius:1px}
  /* 导航栏 */
  .navbar{height:46px;display:flex;align-items:center;padding:0 12px;position:relative;border-bottom:1px solid var(--line)}
  .navbar .back{font-size:22px;color:var(--ink);width:34px;line-height:1;cursor:pointer;position:relative;z-index:2}
  .navbar .title{position:absolute;left:0;right:0;text-align:center;font-size:17px;font-weight:600;color:var(--ink)}
  .navbar .capsule{margin-left:auto;display:flex;align-items:center;gap:5px;border:1px solid #e3e6ec;border-radius:16px;height:30px;padding:0 7px;background:#f7f8fa}
  .navbar .capsule .dots{display:flex;gap:3px}
  .navbar .capsule .dots b{width:4px;height:4px;border-radius:50%;background:#5b606b;display:block}
  .navbar .capsule .cam{width:15px;height:15px;border:1.6px solid #50555f;border-radius:50%;position:relative}
  .navbar .capsule .cam:after{content:"";position:absolute;inset:3px;border-radius:50%;border:1.4px solid #50555f}
  /* 内容 */
  .main{flex:1;background:#f6f7fb;overflow:auto;padding:12px}
  /* 考试卡片 */
  .ecard{position:relative;display:flex;gap:12px;background:#fff;border-radius:14px;padding:12px;margin-bottom:12px;box-shadow:0 4px 14px rgba(40,50,90,.06)}
  .ecard .cv{width:84px;height:84px;flex:none;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;color:#fff}
  .ecard .cv.b1{background:linear-gradient(135deg,#3c7cfc,#6a9bff)}
  .ecard .cv.b2{background:linear-gradient(135deg,#ffb02e,#ffd06a);color:#5a3b00}
  .ecard .cv.b3{background:linear-gradient(135deg,#8a93a6,#c3cad8);color:#3a4150}
  .ecard .cv.b4{background:linear-gradient(135deg,#ff8a3c,#ffb070)}
  .ecard .cv .ct{font-size:11px;line-height:1.4;font-weight:700}
  .ecard .einfo{flex:1;min-width:0;display:flex;flex-direction:column}
  .ecard .et{font-size:14px;font-weight:600;color:var(--ink);line-height:1.4}
  .ecard .es{margin-top:3px;font-size:12px;color:var(--sub)}
  .ecard .est{margin-top:8px;font-size:12px;color:var(--sub)}
  .ecard .est b{color:var(--ink);font-weight:600}
  .ecard .btn{margin-top:auto;align-self:flex-start;border:none;background:var(--blue-bg);color:var(--blue);font-size:13px;font-weight:600;padding:7px 14px;border-radius:16px;cursor:pointer}
  .ecard .btn:active{filter:brightness(.96)}
  /* 印章 */
  .stamp{position:absolute;top:10px;right:10px;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;transform:rotate(-12deg);border:2px dashed;padding:3px;text-align:center;line-height:1.1}
  .stamp.on{color:var(--orange);border-color:var(--orange);background:rgba(255,122,60,.06)}
  .stamp.off{color:var(--gray);border-color:var(--gray);background:rgba(182,188,199,.06)}
  .more{margin-top:6px;text-align:center;font-size:12px;color:#b6bcc7;display:flex;align-items:center;justify-content:center;gap:10px}
  .more:before,.more:after{content:"";width:30px;height:1px;background:#e3e6ec}
  /* Toast */
  .toast{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) scale(.96);background:rgba(20,24,35,.86);color:#fff;font-size:13px;padding:10px 16px;border-radius:10px;z-index:30;opacity:0;visibility:hidden;transition:opacity .2s ease,transform .2s ease;text-align:center;max-width:80%}
  .toast.show{opacity:1;visibility:visible;transform:translate(-50%,-50%) scale(1)}
</style>
</head>
<body>
  <div class="phone">
    <div class="statusbar">
      <span>9:41</span>
      <div class="right"><span class="signal"><i></i><i></i><i></i><i></i></span><span style="font-size:11px">5G</span><span class="battery"><i></i></span></div>
    </div>
    <div class="navbar">
      <div class="back" onclick="goBack()">‹</div>
      <div class="title">我的考试</div>
      <div class="capsule"><span class="dots"><b></b><b></b><b></b></span><span class="cam"></span></div>
    </div>

    <div class="main">
      <!-- 卡片1 -->
      <div class="ecard">
        <div class="cv b1"><div class="ct">小程序抽奖<br>全链路玩法<br><span style="opacity:.8;font-weight:400">基础玩法</span></div></div>
        <div class="einfo">
          <div class="et">3+N新抽奖玩法培训考试</div>
          <div class="est">交卷:<b>8</b>　得分:<b>-</b></div>
          <button class="btn" onclick="toast('（原型）进入考试作答')">立即答题</button>
        </div>
        <div class="stamp on">进行中</div>
      </div>

      <!-- 卡片2 -->
      <div class="ecard">
        <div class="cv b2"><div class="ct">LINLEE®<br><span style="font-weight:400">小黄鸭</span></div></div>
        <div class="einfo">
          <div class="et">2022年客户满意度问卷调查表</div>
          <div class="es">部门员工添加与离职交接</div>
          <div class="est">交卷:<b>3</b>　得分:<b>-</b></div>
          <button class="btn" onclick="toast('（原型）进入考试作答')">立即答题</button>
        </div>
        <div class="stamp on">进行中</div>
      </div>

      <!-- 卡片3 -->
      <div class="ecard">
        <div class="cv b3"><div class="ct">营销策略<br>试卷</div></div>
        <div class="einfo">
          <div class="et">营销策略试卷</div>
          <div class="est">交卷:<b>7</b>　得分:<b>-</b></div>
          <button class="btn" onclick="toast('（原型）查看问卷')">查看 问卷</button>
        </div>
        <div class="stamp off">已结束</div>
      </div>

      <!-- 卡片4 -->
      <div class="ecard">
        <div class="cv b4"><div class="ct">SHING<br>金</div></div>
        <div class="einfo">
          <div class="et">小程序操作考试</div>
          <div class="est">交卷:<b>8</b>　得分:<b>-</b></div>
          <button class="btn" onclick="toast('（原型）查看问卷')">查看 问卷</button>
        </div>
        <div class="stamp off">已结束</div>
      </div>

      <div class="more">没有更多了</div>
    </div>

    <div class="toast" id="toast"></div>
  </div>

<script>
  function goBack(){ location.href='course-admin-home.html'; }
  var toastTimer;
  function toast(msg){
    var t=document.getElementById('toast');
    t.textContent=msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer=setTimeout(function(){ t.classList.remove('show'); },1800);
  }
</script>
</body>
</html>
